http:
  address: 0.0.0.0:${PORT:4195}

input:
  batched:
    child:
      http_client:
        url: ${WIKIMEDIA_STREAM_URL:https://stream.wikimedia.org/v2/stream/recentchange}
        verb: GET
        headers:
          Accept: text/event-stream
          User-Agent: ${WIKIMEDIA_USER_AGENT}
        timeout: 0s
        stream:
          enabled: true
          reconnect: true
          scanner:
            lines:
              custom_delimiter: "\n"
              max_buffer_size: 1048576
              omit_empty: true
    policy:
      count: 500
      period: 5s

pipeline:
  threads: 4
  processors:
    - mapping: |
        root = if content().string().has_prefix("data:") {
          content().string().trim_prefix("data:").trim().parse_json()
        } else {
          deleted()
        }
    - mapping: |
        root = if this.wiki == "enwiki" &&
          this.meta.domain != "canary" &&
          this.namespace == 0 &&
          ["edit", "new"].contains(this.type) &&
          this.revision.new != null {
          this
        } else {
          deleted()
        }
    - dedupe:
        cache: wikipedia_events
        key: '${! json("title") }-${! json("revision.new") }'
    - wikipedia_hydrate:
        api_url: ${WIKIPEDIA_ACTION_API:https://en.wikipedia.org/w/api.php}
        user_agent: ${WIKIMEDIA_USER_AGENT}
    - dedupe:
        cache: wikipedia_revisions
        key: '${! json("id") }-${! json("revision_id") }'

output:
  turbopuffer:
    api_key: ${TURBOPUFFER_API_KEY}
    region: ${TURBOPUFFER_REGION:gcp-us-central1}
    base_url: '${TURBOPUFFER_BASE_URL:}'
    namespace: ${TURBOPUFFER_NAMESPACE:wikipedia-en-live}
    distance_metric: cosine_distance
    schema:
      title:
        type: string
        full_text_search: true
        filterable: false
      text:
        type: string
        full_text_search: true
        filterable: false
      embedding_text:
        type: string
        filterable: false
        embed:
          model: nvidia/nemotron-3.5-embed-1b
          dims: 1024
          dtype: f16
      url:
        type: string
        filterable: false
      revision_id:
        type: int
      updated_at:
        type: datetime
      ingested_at:
        type: datetime
      source_event_at:
        type: datetime
    max_in_flight: 4
    newer_than: revision_id
    batching:
      count: 100
      period: 1s

logger:
  level: INFO
  format: logfmt
  add_timestamp: true

cache_resources:
  - label: wikipedia_events
    memory:
      default_ttl: 24h
      shards: 16
  - label: wikipedia_revisions
    memory:
      default_ttl: 24h
      shards: 16
